bind 0.0.0.0
protected-mode no
port 6379

# Cache + pub/sub + Celery broker. AOF keeps queued tasks across restarts.
appendonly yes
appendfsync everysec

maxmemory 256mb
# Broker keys must never be evicted; only volatile (TTL) cache keys may be.
maxmemory-policy volatile-lru

tcp-keepalive 60
timeout 0
