# Baseline for a 2-4 vCPU / 4-8 GB host. Tune shared_buffers (~25% RAM) and
# effective_cache_size (~50-75% RAM) for larger machines.
listen_addresses = '*'
max_connections = 200
shared_buffers = 512MB
effective_cache_size = 2GB
work_mem = 8MB
maintenance_work_mem = 128MB

wal_level = replica
max_wal_size = 2GB
min_wal_size = 256MB
checkpoint_completion_target = 0.9

timezone = 'UTC'
log_timezone = 'UTC'

# Durability: keep synchronous commit on; the points ledger depends on it.
synchronous_commit = on
fsync = on
full_page_writes = on

log_min_duration_statement = 500ms
log_lock_waits = on
log_line_prefix = '%m [%p] %q%u@%d '
deadlock_timeout = 1s
idle_in_transaction_session_timeout = 60s
statement_timeout = 30s

password_encryption = scram-sha-256
