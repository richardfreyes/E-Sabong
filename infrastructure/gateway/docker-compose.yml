# Shared HTTPS gateway for the Contabo layout (one VPS, UAT + production). Its own Compose
# project, so deploying or stopping an environment never touches it and vice versa.
#
#   infrastructure/scripts/gateway.sh up|config|validate|reload|logs|ps|down
#
# Settings: infrastructure/gateway/.env (copy .env.example; mode 600). Runbook:
# docs/deployment-contabo.md.
name: esabong-gateway

services:
  gateway:
    image: caddy:2.10-alpine
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }
    environment:
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL is required}
      PROD_HOST: ${PROD_HOST:?PROD_HOST is required}
      UAT_HOST: ${UAT_HOST:?UAT_HOST is required}
      UAT_ACCESS_TOKEN: ${UAT_ACCESS_TOKEN:?UAT_ACCESS_TOKEN is required (32+ letters and digits)}
      # Unused. The UAT site is public; this remains so existing env files still load.
      UAT_ALLOWED_IPS: ${UAT_ALLOWED_IPS:-}
      # Space-separated CIDRs allowed to reach /owner/ and /api/v1/platform/. Empty = everyone.
      PROD_OWNER_ALLOWED_IPS: ${PROD_OWNER_ALLOWED_IPS:-}
      # Upstream DDoS proxy (Cloudflare) in front of the gateway: its published CIDRs, space-separated,
      # and the header carrying the visitor address. Empty = no proxy trusted (today's behaviour).
      GATEWAY_TRUSTED_PROXIES: ${GATEWAY_TRUSTED_PROXIES:-}
      GATEWAY_CLIENT_IP_HEADER: ${GATEWAY_CLIENT_IP_HEADER:-}
    # Checks the UAT token/allowlist, then runs Caddy (infrastructure/gateway/entrypoint.sh).
    entrypoint: ["/bin/sh", "/etc/caddy/entrypoint.sh"]
    command: ["run"]
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./entrypoint.sh:/etc/caddy/entrypoint.sh:ro
      - gatewaydata:/data
      - gatewayconfig:/config
    networks: [public, prod, uat, tunnel]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3
    cpu_shares: 1024
    deploy:
      resources:
        limits: { cpus: "${GATEWAY_CPUS:-1}", memory: "${GATEWAY_MEMORY:-256m}", pids: 256 }

  # Cloudflare Tunnel `esabong-origin` (opt-in: COMPOSE_PROFILES=tunnel and TUNNEL_TOKEN in .tunnel.env).
  # The VPS dials out to Cloudflare and visitors arrive through that connection, so 80/443 need
  # not be reachable from the internet (HTTP_PORT/HTTPS_PORT=127.0.0.1:...): the origin IP no
  # longer serves anything a scanner could tie to the domains. Public hostnames are configured
  # in the Cloudflare dashboard: https://gateway:443, Origin Server Name = the hostname,
  # No TLS Verify = on (the hop stays inside this Docker network).
  tunnel:
    image: cloudflare/cloudflared:2026.10.7
    profiles: [tunnel]
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "--metrics", "127.0.0.1:2000", "run"]
    # TUNNEL_TOKEN only, in its own file (mode 600, git-ignored), written with
    # infrastructure/scripts/put-secret.sh so it never appears in .env, shell history or logs.
    env_file:
      - path: ./.tunnel.env
        required: false
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [tunnel]
    depends_on: [gateway]
    deploy:
      resources:
        limits: { cpus: "0.5", memory: "128m", pids: 128 }

networks:
  # Egress for ACME and the published ports.
  public: {}
  # Cloudflare Tunnel <-> gateway. Fixed range so GATEWAY_TRUSTED_PROXIES can trust it for
  # CF-Connecting-IP (nothing else is attached to this network). Needs egress to Cloudflare.
  tunnel:
    ipam:
      config:
        - subnet: 10.250.250.0/29
  # One private network per environment (internal: no egress), created by gateway.sh.
  prod:
    name: esabong-prod-gateway
    external: true
  uat:
    name: esabong-uat-gateway
    external: true

volumes:
  # Certificates and ACME account (back up with the production backups).
  gatewaydata:
  gatewayconfig:
