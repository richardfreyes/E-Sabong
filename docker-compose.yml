name: esabong

# Rotate container logs so a busy API cannot fill the disk.
x-logging: &logging
  driver: json-file
  options:
    max-size: ${LOG_MAX_SIZE:-20m}
    max-file: "${LOG_MAX_FILES:-5}"

x-api-env: &api-env
  ENVIRONMENT: ${ENVIRONMENT:-development}
  APP_NAME: ${APP_NAME:-Event Platform}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  DEPLOYMENT_MODE: ${DEPLOYMENT_MODE:-shared}
  DEDICATED_TENANT_SLUG: ${DEDICATED_TENANT_SLUG:-}
  BASE_DOMAIN: ${BASE_DOMAIN:-localhost}
  PLATFORM_HOST: ${PLATFORM_HOST:-owner.localhost}
  PUBLIC_SCHEME: ${PUBLIC_SCHEME:-https}
  ALLOW_TENANT_HEADER: ${ALLOW_TENANT_HEADER:-false}
  # Tenant served at the bare BASE_DOMAIN (Contabo layout); empty = none.
  ROOT_TENANT_SLUG: ${ROOT_TENANT_SLUG:-}
  DATABASE_URL_APP: postgresql+asyncpg://esabong_app:${DB_APP_PASSWORD}@postgres:5432/${DB_NAME:-esabong}
  DATABASE_URL_PLATFORM: postgresql+asyncpg://esabong_platform:${DB_PLATFORM_PASSWORD}@postgres:5432/${DB_NAME:-esabong}
  DATABASE_URL_MIGRATIONS: postgresql+asyncpg://esabong_owner:${DB_OWNER_PASSWORD}@postgres:5432/${DB_NAME:-esabong}
  REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
  REDIS_MAX_CONNECTIONS: ${REDIS_MAX_CONNECTIONS:-100}
  REDIS_PUBSUB_MAX_CONNECTIONS: ${REDIS_PUBSUB_MAX_CONNECTIONS:-1024}
  REDIS_POOL_TIMEOUT_SECONDS: ${REDIS_POOL_TIMEOUT_SECONDS:-5}
  CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
  CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/2
  JWT_SECRET: ${JWT_SECRET}
  COOKIE_SECURE: ${COOKIE_SECURE:-true}
  LICENSE_PRIVATE_KEY_PEM: ${LICENSE_PRIVATE_KEY_PEM:-}
  LICENSE_PUBLIC_KEY_PEM: ${LICENSE_PUBLIC_KEY_PEM:-}
  LICENSE_TOKEN: ${LICENSE_TOKEN:-}
  LICENSE_HEARTBEAT_URL: ${LICENSE_HEARTBEAT_URL:-}
  VIDEO_CREDENTIALS_KEY: ${VIDEO_CREDENTIALS_KEY:-}
  VIDEO_API_HOSTS: ${VIDEO_API_HOSTS:-[]}
  VIDEO_MEDIA_HOSTS: ${VIDEO_MEDIA_HOSTS:-[]}
  # Live streaming (docs/live-streaming/README.md). Off until MEDIAMTX_API_PASSWORD is set.
  MEDIAMTX_API_URL: http://mediamtx:9997
  MEDIAMTX_API_PASSWORD: ${MEDIAMTX_API_PASSWORD:-}
  STREAM_RTMP_URL: ${STREAM_RTMP_URL:-}
  STREAM_RTMPS_URL: ${STREAM_RTMPS_URL:-}
  STREAM_STUN_URLS: ${STREAM_STUN_URLS:-[]}
  STREAM_TURN_URLS: ${STREAM_TURN_URLS:-[]}
  STREAM_TURN_SECRET: ${STREAM_TURN_SECRET:-}
  VIDEO_SOURCE_HOSTS: ${VIDEO_SOURCE_HOSTS:-[]}
  STREAM_TEST_SOURCE: ${STREAM_TEST_SOURCE:-}
  MEDIA_ROOT: /data/media
  SMTP_HOST: ${SMTP_HOST:-mailpit}
  SMTP_PORT: ${SMTP_PORT:-1025}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_USE_TLS: ${SMTP_USE_TLS:-false}
  MAIL_FROM: ${MAIL_FROM:-no-reply@localhost}
  INVOICE_TAX_RATE_BPS: ${INVOICE_TAX_RATE_BPS:-0}
  DEFAULT_CURRENCY: ${DEFAULT_CURRENCY:-PHP}
  API_DOCS_ENABLED: ${API_DOCS_ENABLED:-}

services:
  postgres:
    logging: *logging
    networks: [backend]
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD}
      POSTGRES_DB: postgres
      DB_NAME: ${DB_NAME:-esabong}
      DB_OWNER_PASSWORD: ${DB_OWNER_PASSWORD}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD}
      DB_PLATFORM_PASSWORD: ${DB_PLATFORM_PASSWORD}
      DB_EXTRA_DATABASES: ${DB_EXTRA_DATABASES:-}
    command:
      - postgres
      - -c
      - config_file=/etc/postgresql/postgresql.conf
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/scripts/init-roles.sh:/docker-entrypoint-initdb.d/10-init-roles.sh:ro
      - ./infrastructure/postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./db/backups:/backups
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    logging: *logging
    networks: [backend]
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "/usr/local/etc/redis/redis.conf", "--requirepass", "${REDIS_PASSWORD}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - redisdata:/data
      - ./infrastructure/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    logging: *logging
    networks: [backend]
    build:
      context: .
      dockerfile: api/Dockerfile
    environment: *api-env
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    logging: *logging
    networks: [backend, edge]
    build:
      context: .
      dockerfile: api/Dockerfile
    restart: unless-stopped
    environment: *api-env
    volumes:
      - media:/data/media
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health').status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    logging: *logging
    networks: [backend, edge]
    build:
      context: .
      dockerfile: api/Dockerfile
    restart: unless-stopped
    environment: *api-env
    command: ["celery", "-A", "app.workers.celery_app", "worker", "--loglevel=INFO", "--concurrency=2"]
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.workers.celery_app inspect ping -d celery@$$HOSTNAME --timeout 10 | grep -q pong"]
      interval: 60s
      timeout: 20s
      retries: 3
      start_period: 30s
    volumes:
      - media:/data/media
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  beat:
    logging: *logging
    networks: [backend, edge]
    build:
      context: .
      dockerfile: api/Dockerfile
    restart: unless-stopped
    environment: *api-env
    command: ["celery", "-A", "app.workers.celery_app", "beat", "--loglevel=INFO", "--schedule=/tmp/celerybeat-schedule"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # Live video. Only `edge`: Caddy proxies WHEP/WHIP and HLS to it, it calls the API's auth
  # callback, and external sources need outbound internet (the backend network is internal in
  # production). Media leaves on RTMP 1935 (ingest) and WebRTC 8189 UDP/TCP (playback).
  # Opt-in: COMPOSE_PROFILES=streaming (plus MEDIAMTX_API_PASSWORD for the API side).
  mediamtx:
    logging: *logging
    networks: [edge]
    profiles: ["streaming"]
    image: bluenviron/mediamtx:1.21.3-ffmpeg
    restart: unless-stopped
    environment:
      MTX_WEBRTCADDITIONALHOSTS: ${STREAM_PUBLIC_HOSTS:-127.0.0.1}
      MTX_RTMPENCRYPTION: ${STREAM_RTMP_ENCRYPTION:-no}
    volumes:
      - ./infrastructure/mediamtx/mediamtx.yml:/mediamtx.yml:ro
    ports:
      - "${STREAM_RTMP_BIND:-0.0.0.0}:${STREAM_RTMP_PORT:-1935}:1935"
      - "${STREAM_WEBRTC_PORT:-8189}:8189/udp"
      - "${STREAM_WEBRTC_PORT:-8189}:8189/tcp"
      # Development only (ng serve proxies /stream to these); removed by docker-compose.prod.yml.
      - "127.0.0.1:${STREAM_HLS_DEV_PORT:-8888}:8888"
      - "127.0.0.1:${STREAM_WEBRTC_DEV_PORT:-8889}:8889"
    healthcheck:
      # Listener checks only: the control API needs credentials, which stay out of healthchecks.
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8889 && nc -z 127.0.0.1 8888 && nc -z 127.0.0.1 1935"]
      interval: 15s
      timeout: 5s
      retries: 3

  caddy:
    logging: *logging
    networks: [edge]
    build:
      context: .
      dockerfile: infrastructure/docker/web.Dockerfile
    restart: unless-stopped
    environment:
      BASE_DOMAIN: ${BASE_DOMAIN:-localhost}
      PLATFORM_HOST: ${PLATFORM_HOST:-owner.localhost}
      ACME_EMAIL: ${ACME_EMAIL:-admin@example.com}
      CADDY_TLS_MODE: ${CADDY_TLS_MODE:-internal}
      VIDEO_BROWSER_ORIGINS: ${VIDEO_BROWSER_ORIGINS:-}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - caddydata:/data
      - caddyconfig:/config
      - media:/srv/media:ro
    healthcheck:
      # Caddy's admin API listens on localhost inside the container only.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      api:
        condition: service_healthy

  mailpit:
    networks: [edge]
    image: axllent/mailpit:v1.21
    profiles: ["dev"]
    ports:
      - "127.0.0.1:8025:8025"

networks:
  # Postgres and Redis live only on `backend`; Caddy only on `edge`. The production override
  # (docker-compose.prod.yml) makes `backend` internal and drops the loopback port bindings.
  backend: {}
  edge: {}

volumes:
  pgdata:
  redisdata:
  media:
  caddydata:
  caddyconfig:
